<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>屏幕翻译助手</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:650px;margin:20px auto;padding:16px;background:#f3f6fb;color:#182235}h1{font-size:25px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0}button{width:100%;padding:13px;margin:8px 0;border:0;border-radius:10px;background:#1769e0;color:white;font-size:16px}select,input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ccd3df;border-radius:9px;font-size:16px}textarea{height:125px}small,#status{color:#626d80;line-height:1.6}img{max-width:100%;display:none;margin-top:10px}</style>
</head><body>
<h1>🌐 屏幕翻译助手</h1><p>英语、阿拉伯语 → 简体中文</p>
<div class="card"><strong>1. 上传截图</strong><input id="photo" type="file" accept="image/*"><img id="preview"><small>先在 LinkedIn、Facebook、Instagram 或其他软件截图，再上传到这里。</small><p><strong>2. 选择原文语言</strong></p><select id="language"><option value="eng">英语 English</option><option value="ara">阿拉伯语 العربية</option></select><button id="recognize">识别截图文字</button><p id="status">等待上传截图。</p></div>
<div class="card"><strong>3. 外语原文</strong><textarea id="source" placeholder="识别结果会显示在这里，也可以直接粘贴文字"></textarea><button id="translate">翻译成中文</button><strong>4. 中文译文</strong><textarea id="result" placeholder="中文翻译会显示在这里"></textarea><button id="copy">复制中文译文</button></div>
<p><small>免费测试原型，需要联网。OCR 组件从 CDN 加载，翻译使用公共演示接口，可能限流或暂时不可用。截图文字在浏览器内识别，识别出的原文会发送给翻译服务。请勿处理密码、验证码或敏感信息。本工具不会自动读取其他 App 屏幕。</small></p>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const photo=document.getElementById('photo'),preview=document.getElementById('preview'),status=document.getElementById('status');
photo.onchange=()=>{const f=photo.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display='block';status.textContent='截图已载入，可以开始识别。'};
document.getElementById('recognize').onclick=async()=>{const f=photo.files[0];if(!f){status.textContent='请先选择截图。';return;}if(!window.Tesseract){status.textContent='识别组件加载失败，请检查网络并刷新。';return;}status.textContent='正在识别，请稍候……';try{const worker=await Tesseract.createWorker(document.getElementById('language').value,1,{logger:m=>{if(m.status)status.textContent=m.status+(m.progress!=null?' '+Math.round(m.progress*100)+'%':'');}});const out=await worker.recognize(f);document.getElementById('source').value=out.data.text.trim();await worker.terminate();status.textContent='识别完成，请检查原文。';}catch(e){status.textContent='识别失败。请检查网络，或换一张更清晰的截图。';}};
document.getElementById('translate').onclick=async()=>{const source=document.getElementById('source').value.trim();if(!source){status.textContent='请先输入或识别外语文字。';return;}status.textContent='正在翻译……';try{const lang=document.getElementById('language').value==='ara'?'ar':'en',chunks=[];for(let i=0;i<source.length;i+=450)chunks.push(source.slice(i,i+450));const translated=[];for(const chunk of chunks){const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(chunk)+'&langpair='+lang+'|zh-CN';const response=await fetch(url);if(!response.ok)throw new Error('服务暂不可用');const data=await response.json();if(data.responseStatus!==200)throw new Error('翻译服务暂不可用');translated.push(data.responseData.translatedText||'');}document.getElementById('result').value=translated.join('\n');status.textContent='翻译完成。请核对重要商务信息。';}catch(e){status.textContent='翻译失败，可能是网络或公共接口限制。你可以复制原文到其他翻译工具。';}};
document.getElementById('copy').onclick=async()=>{const box=document.getElementById('result');if(!box.value){status.textContent='目前没有译文。';return;}try{await navigator.clipboard.writeText(box.value);status.textContent='译文已复制。';}catch(e){box.focus();box.select();status.textContent='请长按选中的译文并选择复制。';}};
</script></body></html>
